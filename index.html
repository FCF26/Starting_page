<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Friends' Co-operative Portal</title>
    <style>
        /* CSS কালার স্কিম এবং স্টাইল */
        :root {
            --bg-color: #1B5B6B; 
            --gold-accent: #d4af37; 
            --text-light: #ffffff; 
            --spinner-base: rgba(255, 255, 255, 0.2); 
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* লোডার স্ক্রিন */
        #loader-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        /* গোলাকার এবং পালস অ্যানিমেটেড লোগো */
        .logo-container {
            width: 140px;
            height: 140px;
            margin-bottom: 25px;
            /* ফাইলের নামের স্পেসের জন্য %20 ব্যবহার করা হয়েছে */
            background-image: url('cop%20LOGO.png'); 
            background-size: cover; 
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffffff; 
            border-radius: 50%; 
            border: 4px solid var(--gold-accent); 
            animation: pulseLogo 2s infinite ease-in-out; 
            
            /* Square box shadow বাগ ফিক্স করার কোড (Hardware Acceleration) */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -moz-backface-visibility: hidden;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
            -webkit-mask-image: -webkit-radial-gradient(white, black);
        }

        /* লোগোর পালস অ্যানিমেশন (সোনালী আভা ছড়ানো) */
        @keyframes pulseLogo {
            0% { 
                transform: scale(1); 
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); 
            }
            50% { 
                transform: scale(1.08); 
                box-shadow: 0 0 20px 15px rgba(212, 175, 55, 0); 
            }
            100% { 
                transform: scale(1); 
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); 
            }
        }

        /* CSS স্পিনার */
        .rupee-spinner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 5px solid var(--spinner-base); 
            border-top: 5px solid var(--gold-accent); 
            position: relative;
            animation: spin 1s linear infinite;
        }

        /* টাকার চিহ্ন (₹) স্পিনারের মাঝখানে */
        .rupee-spinner::after {
            content: '₹';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: var(--gold-accent); 
            font-weight: bold;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 25px;
            font-size: 18px;
            color: var(--text-light); 
            text-align: center;
            padding: 0 20px;
            line-height: 1.5;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        /* Google Apps Script Iframe */
        #portal-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; 
        }
    </style>
</head>
<body>

    <!-- লোডার স্ক্রিন -->
    <div id="loader-screen">
        <div class="logo-container"></div>
        <div class="rupee-spinner"></div>
        <div class="loading-text">
            অনুগ্রহ করে অপেক্ষা করুন... <br>
            Friends' Co-operative Fund (FCF) Portal লোড হচ্ছে...
        </div>
    </div>

    <!-- আইফ্রেম যা Apps Script লোড করবে -->
    <iframe id="portal-iframe" 
            src="https://script.google.com/macros/s/AKfycbx-43vXhKUl-qz8DgjVlRnH4oeFhtUA1a8cDmkOXxQbuH-aYyJ8ai9RPkkx0NYqbOG6tw/exec" 
            onload="portalLoaded()">
    </iframe>

    <script>
        function portalLoaded() {
            var loaderScreen = document.getElementById('loader-screen');
            var portalIframe = document.getElementById('portal-iframe');

            // লোডার স্ক্রিন ফেইড আউট করুন
            loaderScreen.style.opacity = '0';
            
            setTimeout(function() {
                loaderScreen.style.display = 'none';
                portalIframe.style.display = 'block';
            }, 500);
        }
    </script>
</body>
</html>
